name: Unity Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'unity/**'
      - '.github/workflows/unity-android.yml'
  workflow_dispatch:

jobs:
  build-unity-android:
    runs-on: ubuntu-latest
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Compute version 0.0.0.NNN
        id: ver
        shell: bash
        run: |
          COUNT=$(git rev-list --count HEAD)
          printf -v PAD "%03d" "$COUNT"
          VERSION="0.0.0.${PAD}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Unity build version: $VERSION"

      - name: Check Unity secrets
        shell: bash
        run: |
          missing=0
          for name in UNITY_LICENSE UNITY_EMAIL UNITY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name secret is missing"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Run the 'Unity License Bootstrap' workflow or activate Unity Personal locally and add UNITY_LICENSE, UNITY_EMAIL and UNITY_PASSWORD in repository Actions secrets."
            exit 1
          fi

      - name: Build REAL Unity Android APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          ATLANTIC_VERSION: ${{ steps.ver.outputs.version }}
          ATLANTIC_BUILD_CODE: ${{ steps.ver.outputs.code }}
        with:
          projectPath: unity
          unityVersion: 2022.3.62f1
          targetPlatform: Android
          buildMethod: Atlantic4145.Editor.CIBuild.PerformBuild
          androidExportType: androidPackage

      - name: Upload Unity APK
        uses: actions/upload-artifact@v4
        with:
          name: Battle-for-Atlantic-Unity-${{ steps.ver.outputs.version }}
          path: build/Android/**/*.apk
          if-no-files-found: error
